name: Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"

      - name: Install dependencies
        run: npm ci

      - name: Build release APK
        run: npm run build:apk

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release-apks
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/release/app-*-release.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No per-ABI APKs found under android/app/build/outputs/apk/release/"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            abi=$(basename "$apk" | sed -E 's/app-(.+)-release\.apk/\1/')
            cp "$apk" "release-apks/Lugati-${abi}.apk"
          done
          ls -la release-apks/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lugati-apk-${{ github.run_number }}
          path: release-apks/*.apk
          retention-days: 90
        if: github.ref == 'refs/heads/main'

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/*.apk
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
        if: startsWith(github.ref, 'refs/tags/')

      - name: Publish manual workflow release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: manual-${{ github.run_number }}
          name: Manual build ${{ github.run_number }}
          files: release-apks/*.apk
          generate_release_notes: true
        if: github.event_name == 'workflow_dispatch'
